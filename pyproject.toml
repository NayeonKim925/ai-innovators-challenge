[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-investigation"
version = "0.1.0"
description = "Evidence-first manufacturing incident investigation MVP"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=0.4,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
# numpy/scipy are required here (not just in causrca/metal-etch) because
# backend/tests/conftest.py imports them unconditionally for the synthetic
# .mat fixture, so pytest collection fails without them even for unrelated tests.
dev = ["httpx>=0.28,<1", "pytest>=8.3,<9", "ruff>=0.9,<1", "numpy>=2.0,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2"]
# Required only for the pinned upstream CausTR benchmark, never for the API fallback.
causrca = [
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<2",
  "scikit-network>=0.33,<1",
  "torch>=2.2,<3",
  "tqdm>=4.66,<5",
]
# Required only for the Metal Etch PCA baseline (analytics/metal_etch_pca.py and
# data/metal_etch_adapter.py). rank_with_pca_contribution() checks
# _SKLEARN_AVAILABLE and falls back to a declared-baseline warning when these
# are not installed, so they are never required for the API or the causRCA path.
metal-etch = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.5,<2",
]
# Required only to run the demo UI (frontend/app.py). It talks to the FastAPI
# backend over HTTP and never imports backend.app directly, so it is never
# required for the API itself.
frontend = [
  "streamlit>=1.38,<2",
  "requests>=2.32,<3",
]
# Required only when using the competition's OpenAI-compatible LLM gateway.
llm = [
  "openai>=1.66,<2",
]
# Required only for the AWS Lambda container deployment (backend/Dockerfile.lambda).
# Mangum adapts the same FastAPI `app` object to the Lambda/API Gateway proxy
# event -- create_app()/main.py are never modified for this deployment path.
deploy = [
  "mangum>=0.19,<1",
  "boto3>=1.35,<2",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
