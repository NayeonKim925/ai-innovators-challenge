name: Continuum CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -e '.[dev,metal-etch]'
      - name: Run backend tests
        run: python -m pytest -q
      - name: Lint release-path backend files
        run: >-
          python -m ruff check
          backend/app/domain.py
          backend/app/main.py
          backend/app/repositories/cases.py
          backend/app/repositories/investigation_store.py
          backend/app/repositories/investigations.py
          backend/app/services/case_chat.py
          backend/app/services/cases.py
          backend/app/services/handover_linter.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Playwright E2E requires a prepared runtime fixture or API mocks in CI.
  # The Continuum smoke spec is kept in the repository and is run in the
  # release environment once the browser/runtime fixture is provisioned.
